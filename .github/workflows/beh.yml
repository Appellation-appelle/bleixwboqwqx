name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # Cle API de workspace generee dans la console AWS
      # (Claude Platform on AWS -> API keys), pas une cle de console.anthropic.com
      ANTHROPIC_AWS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_AWS_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WS_ID }}
      AWS_REGION: eu-west-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@main
        with:
          # Placeholder pour passer la validation de l'action, neutralise dans settings.env
          anthropic_api_key: "unused"
          # Ce post-step appelle api.anthropic.com en direct avec ANTHROPIC_API_KEY
          classify_inline_comments: "false"
          settings: |
            {
              "env": {
                "CLAUDE_CODE_USE_ANTHROPIC_AWS": "1",
                "AWS_REGION": "eu-west-1",
                "ANTHROPIC_API_KEY": ""
              }
            }
          allowed_bots: "Appellation-appelle[bot]"
          claude_args: |
            --allowedTools "Bash(bun install),Bash(bun test:*),Bash(bun run format),Bash(bun typecheck)"
            --model "claude-opus-4-7"
            --permission-mode auto